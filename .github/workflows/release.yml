name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret-key-at-least-256-bits-long-for-hmac-sha-algorithm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B package
      - uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          generate_release_notes: true