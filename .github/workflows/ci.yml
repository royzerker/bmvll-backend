name: CI

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret-key-at-least-256-bits-long-for-hmac-sha-algorithm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y ejecutar pruebas
        run: mvn -B verify
      - name: Guardar el .jar generado
        uses: actions/upload-artifact@v4
        with:
          name: bmvll-backend-jar
          path: target/*.jar