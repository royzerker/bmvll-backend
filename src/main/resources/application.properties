spring.application.name=backend
server.port=8080

spring.config.import=optional:file:.env[.properties]
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/bmvll_db}

# JWT (login de ADMIN/LIBRARIAN - ver docs/MODELADO.md)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Bootstrap admin (solo se crea si no existe ningun usuario ADMIN)
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
