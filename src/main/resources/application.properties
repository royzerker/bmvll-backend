spring.application.name=backend
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=never

spring.config.import=optional:file:.env[.properties]
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/bmvll_db}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Detrás de nginx: usar X-Forwarded-Proto/Host para que las redirecciones salgan con https://
server.forward-headers-strategy=framework

# Seed del catálogo público (categorías, libros, ejemplares); idempotente
app.seed.enabled=${SEED_ENABLED:false}
